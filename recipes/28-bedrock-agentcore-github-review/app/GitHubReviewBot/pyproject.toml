[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
authors = [{ name = "Known Systems AI, Inc." }]
name = "GitHubReviewBot"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.19",
    "urllib3>=2.8.0",
    "aws-opentelemetry-distro >= 0.21.0",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "mcp >= 1.30.0, < 2",
    "strands-agents >= 1.13.0",
    "boto3 >= 1.35.0",
    "PyGithub >= 2.0.0",
    "httpx >= 0.27.0",
    "dnsid @ git+https://github.com/dnsid-ai/dnsid-py@v0.29.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]
