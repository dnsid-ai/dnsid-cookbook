[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "GitHubReviewBot"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
requires-python = ">=3.11"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "mcp >= 1.19.0",
    "strands-agents >= 1.13.0",
    "boto3 >= 1.35.0",
    "PyGithub >= 2.0.0",
    "httpx >= 0.27.0",
    "dnsid @ git+https://github.com/dnsid-ai/dnsid-py@c9ae777cb4b473eace67d2b745b1760032e32738",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]
