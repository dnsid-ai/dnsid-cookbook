# SPIRE server for trust domain rackloria.test (DNSid cookbook recipe 16)
server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  trust_domain = "rackloria.test"
  data_dir = "/opt/spire/data/server"
  socket_path = "/run/spire/server/api.sock"
  log_level = "INFO"
  log_format = "json"
  ca_ttl = "72h"
  default_x509_svid_ttl = "1h"

  federation {
    # SPIFFE bundle endpoint (https_spiffe profile: served with this server's own SVID)
    bundle_endpoint {
      address = "0.0.0.0"
      port = 8443
      # Explicit profile (SPIRE 1.15 warns that relying on the default will be fatal in a future release).
      # https_spiffe: the endpoint authenticates with this server's own SVID; peers verify it against the
      # bundle they already hold for this trust domain.
      profile "https_spiffe" {}
    }

    # Rackloria -> Acme trust uses STANDARD SPIRE federation. It is deliberately NOT gated by
    # DNSid in this recipe (DNSid gates only Acme's acceptance of Rackloria). Seeded once by
    # `make bootstrap` with `bundle set`, then refreshed by SPIRE from Acme's bundle endpoint.
    federates_with "acme.test" {
      bundle_endpoint_url = "https://acme-server:8443"
      bundle_endpoint_profile "https_spiffe" {
        endpoint_spiffe_id = "spiffe://acme.test/spire/server"
      }
    }
  }
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/opt/spire/data/server/datastore.sqlite3"
    }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/opt/spire/data/server/keys.json"
    }
  }
}

health_checks {
  listener_enabled = true
  bind_address = "0.0.0.0"
  bind_port = "8080"
  live_path = "/live"
  ready_path = "/ready"
}
