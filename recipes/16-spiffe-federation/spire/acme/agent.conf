# SPIRE agent for trust domain acme.test (DNSid cookbook recipe 16)
agent {
  data_dir = "/opt/spire/data/agent"
  log_level = "INFO"
  log_format = "json"
  server_address = "acme-server"
  server_port = "8081"
  socket_path = "/run/spire/agent/public/api.sock"
  trust_domain = "acme.test"
  # Bootstrap trust: this org's own server CA bundle, written by make bootstrap (no insecure_bootstrap).
  trust_bundle_path = "/opt/spire/conf/bootstrap/bundle.crt"
  # One-time node attestation token minted by make bootstrap (expanded from the environment).
  join_token = "${JOIN_TOKEN}"
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }
  # Disk-backed keys on the persistent data volume: the agent keeps its identity across
  # container restarts/recreation (memory keys forced re-attestation with a spent join token).
  KeyManager "disk" {
    plugin_data {
      directory = "/opt/spire/data/agent"
    }
  }
  # Workloads share ONLY this agent's PID namespace and run as distinct uids; entries select
  # on unix:uid. No Docker socket and no host PID namespace are needed.
  WorkloadAttestor "unix" {
    plugin_data {}
  }
}

health_checks {
  listener_enabled = true
  bind_address = "0.0.0.0"
  bind_port = "8080"
  live_path = "/live"
  ready_path = "/ready"
}
