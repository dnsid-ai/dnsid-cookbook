# SPIRE server for trust domain acme.test (DNSid cookbook recipe 16)
server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  trust_domain = "acme.test"
  data_dir = "/opt/spire/data/server"
  socket_path = "/run/spire/server/api.sock"
  log_level = "INFO"
  log_format = "json"
  ca_ttl = "72h"
  default_x509_svid_ttl = "1h"

  federation {
    # SPIFFE bundle endpoint (https_spiffe profile: served with this server's own SVID)
    bundle_endpoint {
      address = "0.0.0.0"
      port = 8443
      # Explicit profile (SPIRE 1.15 warns that relying on the default will be fatal in a future release).
      # https_spiffe: the endpoint authenticates with this server's own SVID; peers verify it against the
      # bundle they already hold for this trust domain.
      profile "https_spiffe" {}
    }

    # Acme deliberately has NO federates_with block for rackloria.test.
    # SPIRE would otherwise refresh Rackloria's bundle on its own, bypassing the DNSid gate.
    # The Rackloria bundle is written only by the DNSid federation controller
    # (`bundle set` after verification, `bundle delete -mode dissociate` on withdrawal).
  }
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/opt/spire/data/server/datastore.sqlite3"
    }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/opt/spire/data/server/keys.json"
    }
  }
}

health_checks {
  listener_enabled = true
  bind_address = "0.0.0.0"
  bind_port = "8080"
  live_path = "/live"
  ready_path = "/ready"
}
