[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore-gateway-mcp-image-poc"
version = "0.1.0"
description = "Local Bedrock image target and UI for the AgentCore Gateway MCP image PoC"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "dnsid @ git+https://github.com/dnsid-ai/dnsid-py@v0.22.0",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
