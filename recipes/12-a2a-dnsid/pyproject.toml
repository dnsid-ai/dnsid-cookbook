[project]
authors = [{ name = "Known Systems AI, Inc." }]
name = "recipe-12-a2a-dnsid"
version = "0.1.0"
description = "DNSid cookbook recipe 12 — A2A protocol + DNSid"
requires-python = ">=3.11"
# Versions below are the ones this recipe was actually tested against
# (Python 3.13, 2026-10). Later versions probably work; these are known to.
dependencies = [
    "certifi>=2026.10.19",
    "urllib3>=2.8.0",
    "dnsid @ git+https://github.com/dnsid-ai/dnsid-py@v0.29.1",
    "a2a-sdk==1.2.3",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "dnspython==2.9.0",
    "sse-starlette==3.5.0",
]
