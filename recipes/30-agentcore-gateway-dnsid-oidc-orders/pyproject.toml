[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
authors = [{ name = "Known Systems AI, Inc." }]
name = "agentcore-gateway-dnsid-orders"
version = "0.1.0"
description = "Minimal DNSid action verification for Amazon Bedrock AgentCore Gateway"
requires-python = ">=3.11"
# Versions tested with Python 3.13.
dependencies = [
    "certifi>=2026.10.19",
    "urllib3>=2.8.0",
    "boto3==1.43.117",
    "dnsid @ git+https://github.com/dnsid-ai/dnsid-py@v0.29.1",
]

[project.optional-dependencies]
dev = ["pip==26.2.2", "pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
