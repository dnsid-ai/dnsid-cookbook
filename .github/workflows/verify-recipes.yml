# Per-recipe `make verify` gate.
#
# Every recipe with a one-shot, hermetic `make verify` gets a matrix entry below.
# Adding a recipe to the cookbook means adding it here in the same PR — a recipe
# whose verify never runs in CI silently rots.
#
# Every verify job installs the `dnsid` CLI and pre-pulls the local registry
# image, because the cookbook's single recipe harness is the real DNSid local registry
# driven by that CLI (see CLAUDE.md). Recipes that predate the local registry harness
# simply don't use them.
name: verify-recipes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hardcoded-identity scanner self-test
        run: python3 scripts/test_scan_hardcoded_identities.py

      - name: Scan for hardcoded identities
        run: python3 scripts/scan-hardcoded-identities.py

  verify:
    name: verify ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # In the matrix: recipes whose `make verify` is one-shot and hermetic
          # (no cloud account, no live domain, exits nonzero on failure).
          #
          # Excluded and why:
          #   07 / 07b / 30 (AgentCore gateway) — verify targets a deployed AWS
          #                                       gateway (deploy-only recipes)
          #   28-bedrock-agentcore-github-review — no verify target (deploy-only)
          - recipe: 01-publish-jwks
          - recipe: 06b-go-http-stripe
            go: true
          - recipe: 12-a2a-dnsid
            uv: true
          - recipe: 29-dnsid-message-board
            go: true
          - recipe: 31-langgraph-dnsid-agent
            uv: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.go
        with:
          go-version-file: recipes/${{ matrix.recipe }}/go.mod

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: matrix.uv

      # Public release binaries (same source the dnsid-ai/homebrew-tap cask uses).
      - name: Install dnsid CLI
        run: |
          set -euo pipefail
          base=https://dnsid-prod-cli-binaries.s3.us-east-1.amazonaws.com/cli
          version=$(curl -fsSL "$base/latest")
          test -n "$version"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$version/dnsid_linux_amd64.tar.gz"
          curl -fsSL "$base/$version/SHA256SUMS" | grep linux_amd64.tar.gz | sha256sum -c
          tar -xzf dnsid_linux_amd64.tar.gz dnsid
          sudo install -m 0755 "$RUNNER_TEMP/dnsid" /usr/local/bin/dnsid
          dnsid --version

      - name: Pull local registry image
        run: docker pull ghcr.io/identity-digital/dnsid-local-registry:main

      - name: make verify
        run: make -C "recipes/${{ matrix.recipe }}" verify

      # Local-registry-in-CI has real moving parts (container startup ordering, DNS
      # routing); without the container logs, a red job is undebuggable.
      - name: Dump container state and logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do
            echo "=== docker logs $c ==="
            docker logs --tail 200 "$c" 2>&1 || true
          done
